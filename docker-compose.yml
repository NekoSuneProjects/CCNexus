services:
  ccnexus:
    image: ghcr.io/nekosuneprojects/ccnexus:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CCNEXUS_PUBLIC_URL: ${CCNEXUS_PUBLIC_URL:-http://localhost:3000}
      CCNEXUS_ADMIN_TOKEN: ${CCNEXUS_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
